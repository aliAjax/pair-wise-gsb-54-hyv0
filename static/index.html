<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨海光缆故障与抢修协调</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .4rem; }
    h2 { font-size: 1.05rem; margin-top: 1.6rem; }
  </style>
</head>
<body>
<main>
  <h1>跨海光缆故障与抢修协调</h1>
  <p>最小演示页。抢修资源占用台账（船机 / 接续班组 / 备缆批次）与完整业务流程通过 README 中的 JSON 接口调用。</p>

  <h2>抢修任务</h2>
  <div class="row"><button data-path="/api/records?limit=20">加载记录</button><button data-path="/api/stats">状态统计</button></div>

  <h2>资源占用台账</h2>
  <div class="row">
    <button data-path="/api/batches">备缆批次余量</button>
    <button data-path="/api/occupations?limit=50">全部占用</button>
    <button data-path="/api/occupations?status=confirmed">已确认占用</button>
    <button data-path="/api/occupations?status=draft">草稿（含缺口）</button>
    <button data-path="/api/pending">待核对任务</button>
  </div>

  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
async function show(path) {
  const response = await fetch(path, {headers});
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
document.querySelectorAll("button[data-path]").forEach(button => {
  button.onclick = () => show(button.getAttribute("data-path"));
});
</script>
</body>
</html>
